<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Memory Lane</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="lock-screen">
    <div class="lock-box">
        <input type="password" id="pin-input" maxlength="6" placeholder="******" autocomplete="off">
        <button id="unlock-btn">Unlock Lane</button>
        <div id="lock-error" class="error-msg">Incorrect PIN.</div>
    </div>
</div>

    <header>
        <h1>Our Memory Lane</h1>
        <p>A little corner of the internet just for us, Eon!</p>
    </header>

    <section class="upload-zone">
        <input type="file" id="photo-input" accept="image/*" multiple>
        <input type="text" id="caption-input" placeholder="Write a memory...">
        <button id="upload-btn">Upload to Album</button>
        <div id="progress-bar"></div>
    </section>

    <main class="album-grid" id="album-grid">
    </main>

    <div id="lightbox" class="lightbox">
        <img id="lightbox-img" src="" alt="Enlarged Preview">
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>

</body>
</html>
